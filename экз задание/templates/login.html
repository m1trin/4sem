{% extends 'base.html' %}

{% block title %}Вход в систему — Электронная библиотека{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="glass-panel text-center">
            <div class="mb-4">
                <i class="fa-solid fa-lock-open fs-1 text-indigo"></i>
                <h2 class="mt-3 page-title">Авторизация</h2>
                <p class="text-muted">Введите свои учетные данные для входа</p>
            </div>
            <hr class="border-secondary mb-4">
            
            <form method="POST" class="text-start">
                <div class="mb-3">
                    <label for="login" class="form-label">Логин <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="login" name="login" required placeholder="Введите логин" value="{{ request.form.get('login', '') }}">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-key"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Введите пароль">
                    </div>
                </div>
                
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label text-muted" for="remember">Запомнить меня</label>
                </div>
                
                <button type="submit" class="btn btn-indigo w-100 py-2">
                    <i class="fa-solid fa-sign-in-alt me-1"></i> Войти в систему
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
